apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enrolld
  namespace: lab3-o4
  labels:
    app: enrolld
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enrolld
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
