apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enrolld
  namespace: lab3-o4
  labels:
    app: enrolld
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enrolld
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: External
      external:
        metric:
          name: lab3_arrival_rps
        target:
          type: AverageValue
          averageValue: "84"
