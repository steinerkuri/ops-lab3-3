# O5: foreground, unprivileged, loopback-only. Run from the repository root.
# https://www.haproxy.com/documentation/haproxy-configuration-tutorials/reliability/health-checks/
global
    log stdout format raw local0
    nbthread 1
    stats socket unix@data/o5-haproxy.sock mode 600 level admin

defaults
    mode http
    log global
    option httplog
    option dontlognull
    retries 0
    timeout connect 500ms
    timeout client 2s
    timeout server 2s
    timeout check 500ms

frontend enrolld_in
    bind 127.0.0.1:8080
    default_backend enrolld

backend enrolld
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 1s fastinter 1s downinter 1s fall 3 rise 2
    server s8101 127.0.0.1:8101 check
    server s8102 127.0.0.1:8102 check
    server s8103 127.0.0.1:8103 check
